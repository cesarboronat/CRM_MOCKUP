<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM net2phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002540; --slate:#435E72; --line:#EFEFEF; --line2:#C5CDD4;
  --bg:#F5F5F5; --white:#FFFFFF;
  --blue:#0095FF; --purple:#740CE8; --pink:#FE0687;
  --t-blue:#CCEAFF; --t-purple:#E0CAFA; --t-pink:#FFDAED;
  --radius:10px; --radius-lg:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Open Sans','Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--navy);background:var(--bg)}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--navy)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:flex;min-height:100vh}
.side{width:240px;flex:0 0 240px;background:var(--navy);display:flex;flex-direction:column;gap:4px;padding:28px 16px;position:sticky;top:0;height:100vh}
.brand{padding:8px 12px 30px}
.brand img{width:132px;height:auto;display:block}
.brand small{display:block;color:var(--line2);font-size:11px;font-weight:600;letter-spacing:1.4px;margin-top:10px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 12px;border:0;border-radius:var(--radius);background:transparent;color:var(--line2);font-weight:600;text-align:left}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--blue)}
.nav-btn .count{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);padding:1px 8px;border-radius:999px}
.side-foot{margin-top:auto;border-top:1px solid var(--slate);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.user{display:flex;gap:10px;align-items:center;padding:0 12px}
.user b{color:#fff;font-size:13px;display:block}
.user span{color:var(--line2);font-size:12px}
.reset{background:transparent;border:1px solid var(--slate);color:var(--line2);border-radius:var(--radius);height:40px;font-weight:600;font-size:13px}
.reset:hover{color:#fff;border-color:var(--line2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:18px 36px;background:#fff;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:0 14px;height:44px;flex:1 1 280px;max-width:480px}
.search input{border:0;background:transparent;outline:none;flex:1;height:40px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;background:var(--t-blue);padding:8px 12px;border-radius:999px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--radius);color:var(--slate)}
.lang select{border:0;background:transparent;font-weight:600;color:var(--navy);height:36px;cursor:pointer}
.status i{width:8px;height:8px;border-radius:4px;background:var(--navy)}

.content{padding:32px 36px 48px;display:flex;flex-direction:column;gap:24px;max-width:1400px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.head h1{margin:0;font-size:28px;font-weight:800;line-height:1.2}
.head p{margin:4px 0 0;color:var(--slate)}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{white-space:nowrap;height:44px;padding:0 18px;border-radius:var(--radius);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:#fff}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:#0a3557}
.btn.danger{color:#B0004F;border-color:#F2B8D2}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--purple);font-weight:600;text-align:left}
.link:hover{text-decoration:underline}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg)}
.pad{padding:24px}
.card h2{margin:0 0 12px;font-size:18px;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:20px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--radius-lg)}
.kpi:hover{border-color:var(--line2)}
.kpi span{color:var(--slate);font-size:13px;font-weight:600}
.kpi strong{font-size:32px;font-weight:800;line-height:1.1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;color:var(--slate);font-size:12px;font-weight:700;padding:14px 12px;letter-spacing:.3px}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:#FAFAFA}
.who{display:flex;align-items:center;gap:12px}
.av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--navy)}
.av.lg{width:56px;height:56px;font-size:18px;font-weight:800}
.muted{color:var(--slate)}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--line);white-space:nowrap}
.t-blue{background:var(--t-blue)} .t-purple{background:var(--t-purple)} .t-pink{background:var(--t-pink)} .t-grey{background:var(--line)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--slate)}
.icon-btn:hover{background:var(--bg);color:var(--navy);border-color:var(--line)}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

.companies{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.company{padding:20px;display:flex;flex-direction:column;gap:14px}
.company-top{display:flex;gap:12px;align-items:center}
.logo-sq{width:42px;height:42px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.company-meta{display:flex;justify-content:space-between;color:var(--slate);font-size:13px;gap:8px}
.company-foot{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}

.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--line);border-radius:var(--radius-lg);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:240px;transition:background .15s}
.col.over{background:var(--t-blue)}
.col-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13px;padding:4px 4px 2px}
.col-head small{color:var(--slate);font-weight:600}
.deal{background:#fff;border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:4px;border:1px solid transparent;cursor:grab;text-align:left;width:100%}
.deal:hover{border-color:var(--line2)}
.deal.dragging{opacity:.5}
.deal b{font-size:14px}
.deal .amt{font-weight:700;font-size:13px;margin-top:4px}

.acts{display:flex;flex-direction:column}
.act{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.act .body b{font-weight:600}
.acts.strike .act.done .body b{text-decoration:line-through;color:var(--slate)}
.act input[type=checkbox]{width:20px;height:20px;accent-color:var(--navy);flex:0 0 auto}
.act .when{color:var(--slate);font-size:13px;white-space:nowrap}
.act .when.late{color:#B0004F;font-weight:600}

.profile{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.profile-card{flex:1 1 320px;max-width:400px;display:flex;flex-direction:column;gap:18px}
.profile-main{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px}
.fields{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:18px}
.fields div{display:flex;flex-direction:column;gap:2px}
.fields span{color:var(--slate);font-size:12px;font-weight:600}
.fields b{font-weight:600;word-break:break-word}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--slate);font-weight:600}
.back:hover{color:var(--navy)}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.f input,.f select,.f textarea{height:44px;border:1px solid var(--line2);border-radius:var(--radius);padding:0 12px;background:#fff;font-weight:400}
.f textarea{height:auto;padding:10px 12px;resize:vertical;min-height:88px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--t-blue)}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.err{color:#B0004F;font-size:12px;font-weight:600;min-height:16px}

.overlay{position:fixed;inset:0;background:rgba(0,37,64,.45);display:flex;justify-content:flex-end;z-index:40;animation:fade .15s ease}
.drawer{width:100%;max-width:460px;background:#fff;height:100%;display:flex;flex-direction:column;animation:slide .2s ease}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:24px 28px 8px}
.drawer-head h2{margin:0;font-size:22px;font-weight:800}
.drawer-body{padding:16px 28px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1}
.drawer-foot{padding:16px 28px 24px;display:flex;gap:12px;border-top:1px solid var(--line)}
.drawer-foot .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}

.empty{padding:40px 24px;text-align:center;color:var(--slate);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--navy);font-size:16px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:var(--radius);font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,37,64,.25);animation:fade .2s ease}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .brand{padding:6px 12px;flex:1 0 100%}
  .brand small{display:none}
  .nav-btn{width:auto;flex:1 1 auto}
  .nav-btn .count{display:none}
  .user{display:none}
  .side-foot{flex:1 0 100%;flex-direction:row;justify-content:space-between;align-items:center;padding-top:10px}
  .topbar,.content{padding-left:16px;padding-right:16px}
  .form-row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  function fmtFecha(iso) {
    if (!iso) return '';

    const diff = Math.round((day(d) - day(t)) / 86400000);
    const hh = d.toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
    if (diff === 0) return T.today + ' ' + hh;
    if (diff === 1) return T.tomorrow + ' ' + hh;
    if (diff === -1) return T.yesterday + ' ' + hh;
    return d.toLocaleDateString(T.locale, { day: '2-digit', month: '2-digit' }) + ' ' + hh;
  }

    return head(T.tabs.contactos, T.contactsSub(db.contactos.length), btnNew('new-contacto', T.newContact)) +
      '<div class="filters" role="group" aria-label="' + T.filterState + '">' + chips + '</div>' +
      '<div class="card table-wrap">' + (list.length ?
        '<table><thead><tr><th>' + T.cName + '</th><th>' + T.cCompany + '</th><th>' + T.cPhone + '</th><th>' + T.cEmail + '</th><th>' + T.cState + '</th><th>' + T.cLast + '</th><th><span class="sr-only">' + T.cActions + '</span></th></tr></thead><tbody>' +
        list.map((c) => {
          const e = empresa(c.empresaId), cargo = txt(c, 'cargo');
          return '<tr><td><div class="who"><span class="av ' + tintFor(c.id) + '">' + iniciales(c.nombre) + '</span><div><button type="button" class="link" data-action="ficha" data-id="' + c.id + '">' + esc(c.nombre) + '</button>' + (cargo ? '<div class="muted" style="font-size:12px">' + esc(cargo) + '</div>' : '') + '</div></div></td>' +
            '<td>' + (e ? esc(e.nombre) : '<span class="muted">—</span>') + '</td><td class="num">' + esc(c.telefono) + '</td><td class="muted">' + esc(c.email) + '</td>' +
            '<td><span class="tag ' + estadoTag[c.estado] + '">' + esc(T.estado[c.estado]) + '</span></td><td class="muted">' + lastInteraction(c.id) + '</td>' +
            '<td><div class="row-actions"><button type="button" class="icon-btn" aria-label="' + esc(T.editX(c.nombre)) + '" data-action="edit-contacto" data-id="' + c.id + '">' + ICON.edit + '</button><button type="button" class="icon-btn" aria-label="' + esc(T.delX(c.nombre)) + '" data-action="del-contacto" data-id="' + c.id + '">' + ICON.trash + '</button></div></td></tr>';
        }).join('') + '</tbody></table>'
        : empty(filtered ? T.noResults : T.emptyContacts, filtered ? T.tryOther : T.emptyContactsTxt, btnNew('new-contacto', T.newContact))) +
      '</div>';
  }

  function vFicha() {
    const c = contacto(ui.contactoId);
    if (!c) { ui.tab = 'contactos'; return vContactos(); }
    const e = empresa(c.empresaId);
    const hist = db.actividades.filter((a) => a.contactoId === c.id).sort((x, y) => y.fecha.localeCompare(x.fecha));
    const negs = db.negocios.filter((n) => n.contactoId === c.id);
    const ciudad = e ? txt(e, 'ciudad') : '';
    return '<button type="button" class="back" data-action="tab" data-tab="contactos">' + ICON.back + T.tabs.contactos + '</button>' +
      '<div class="profile">' +
      '<section class="card pad profile-card" aria-label="' + T.contactData + '">' +
      '<div class="who"><span class="av lg ' + tintFor(c.id) + '">' + iniciales(c.nombre) + '</span><div><div style="font-size:20px;font-weight:800;line-height:1.25">' + esc(c.nombre) + '</div><div class="muted">' + esc([txt(c, 'cargo'), e && e.nombre].filter(Boolean).join(', ')) + '</div></div></div>' +
      '<div><span class="tag ' + estadoTag[c.estado] + '">' + esc(T.estado[c.estado]) + '</span></div>' +
      '<div class="fields"><div><span>' + T.cPhone + '</span><b class="num">' + (esc(c.telefono) || '—') + '</b></div><div><span>' + T.cEmail + '</span><b>' + (esc(c.email) || '—') + '</b></div><div><span>' + T.cCompany + '</span><b>' + (e ? esc(e.nombre) + (ciudad ? ', ' + esc(ciudad) : '') : '—') + '</b></div><div><span>' + T.owner + '</span><b>Laura Gómez</b></div></div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn primary" style="flex:1" data-action="edit-contacto" data-id="' + c.id + '">' + T.edit + '</button><button type="button" class="btn" style="flex:1" data-action="new-negocio" data-contacto="' + c.id + '">' + T.createDeal + '</button></div>' +
      '</section>' +
      '<div class="profile-main">' +
      '<section class="card pad" aria-label="' + T.logInteraction + '"><h2>' + T.logInteraction + '</h2>' +
      '<form id="quick" style="display:flex;flex-direction:column;gap:12px" novalidate>' +
      '<div class="form-row"><label class="f">' + T.type + '<select name="tipo">' + ['call', 'email', 'meeting', 'note'].map((t) => '<option value="' + t + '">' + T.tipo[t] + '</option>').join('') + '</select></label>' +
      '<label class="f">' + T.result + '<select name="resultado">' + Object.keys(T.res).map((r) => '<option value="' + r + '">' + T.res[r] + '</option>').join('') + '</select></label></div>' +
      '<label class="f">' + T.note + '<textarea name="detalle" rows="3" placeholder="' + T.notePh + '"></textarea></label>' +
      '<div style="display:flex;justify-content:flex-end"><button type="submit" class="btn primary">' + T.saveInteraction + '</button></div>' +
      '</form></section>' +
      (negs.length ? '<section class="card pad"><h2>' + T.deals + '</h2><div class="acts">' + negs.map((n) => '<div class="act"><span class="tag t-purple">' + esc(T.etapa[n.etapa]) + '</span><div class="body"><b>' + esc(txt(n, 'titulo')) + '</b></div><span class="num" style="font-weight:700">' + money(n.monto) + '</span><button type="button" class="icon-btn" aria-label="' + T.editDeal + '" data-action="edit-negocio" data-id="' + n.id + '">' + ICON.edit + '</button></div>').join('') + '</div></section>' : '') +
      '<section class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>' + T.history + '</h2><button type="button" class="btn sm" data-action="new-act" data-contacto="' + c.id + '">' + ICON.plus + T.scheduleAct + '</button></div><div class="acts">' +
      (hist.length ? hist.map((a) => actRow(a, { detail: true, hideContact: true, check: !a.hecha, edit: true })).join('') : empty(T.noHistory, T.noHistoryTxt)) +
      '</div></section></div></div>';
  }

  function vEmpresas() {
    const s = q();
    const list = db.empresas.filter((e) => !s || [e.nombre, txt(e, 'industria'), txt(e, 'ciudad')].join(' ').toLowerCase().includes(s));
    return head(T.tabs.empresas, T.companiesSub(db.empresas.length), btnNew('new-empresa', T.newCompany)) +
      (list.length ? '<div class="companies">' + list.map((e) => {
        const nc = db.contactos.filter((c) => c.empresaId === e.id).length;
        const pipe = db.negocios.filter((n) => n.empresaId === e.id && OPEN(n)).reduce((s2, n) => s2 + Number(n.monto || 0), 0);
        return '<article class="card company"><div class="company-top"><span class="logo-sq">' + esc(e.nombre[0] || '?') + '</span><div><b>' + esc(e.nombre) + '</b><div class="muted" style="font-size:13px">' + (esc(txt(e, 'industria')) || T.noIndustry) + '</div></div></div>' +
          '<div class="company-meta"><span>' + (esc(txt(e, 'ciudad')) || '—') + '</span><span>' + T.nContacts(nc) + '</span></div>' +
          '<div class="company-meta"><span>' + T.openPipeline + '</span><b style="color:var(--navy)">' + money(pipe) + '</b></div>' +
          '<div class="company-foot"><button type="button" class="btn sm" style="flex:1" data-action="empresa-contactos" data-id="' + e.id + '">' + T.seeContacts + '</button><button type="button" class="icon-btn" aria-label="' + esc(T.editX(e.nombre)) + '" data-action="edit-empresa" data-id="' + e.id + '">' + ICON.edit + '</button><button type="button" class="icon-btn" aria-label="' + esc(T.delX(e.nombre)) + '" data-action="del-empresa" data-id="' + e.id + '">' + ICON.trash + '</button></div></article>';
      }).join('') + '</div>' : '<div class="card">' + empty(s ? T.noResults : T.emptyCompanies, s ? T.tryOtherSearch : T.emptyCompaniesTxt, btnNew('new-empresa', T.newCompany)) + '</div>');
  }

  function vNegocios() {
    const s = q();
    const list = db.negocios.filter((n) => { const e = empresa(n.empresaId); return !s || [txt(n, 'titulo'), e && e.nombre].join(' ').toLowerCase().includes(s); });
    const abierto = list.filter(OPEN).reduce((t, n) => t + Number(n.monto || 0), 0);
    return head(T.tabs.negocios, T.dealsSub(money(abierto)), btnNew('new-negocio', T.newDeal)) +
      '<div class="board">' + ETAPAS.map((et) => {
        const items = list.filter((n) => n.etapa === et);
        return '<div class="col" data-etapa="' + et + '"><div class="col-head"><span>' + T.etapa[et] + '</span><small>' + items.length + ' · ' + money(items.reduce((t, n) => t + Number(n.monto || 0), 0)) + '</small></div>' +
          items.map((n) => { const e = empresa(n.empresaId); return '<button type="button" class="deal" draggable="true" data-id="' + n.id + '" data-action="edit-negocio"><b>' + esc(txt(n, 'titulo')) + '</b><span class="muted" style="font-size:13px">' + (e ? esc(e.nombre) : T.noCompany) + '</span><span class="amt num">' + money(n.monto) + '</span></button>'; }).join('') +
          '</div>';
      }).join('') + '</div>';
  }

  function vActividades() {
    const s = q();
    let list = db.actividades.filter((a) => { const c = contacto(a.contactoId); return !s || [actTitle(a), T.tipo[a.tipo], c && c.nombre].join(' ').toLowerCase().includes(s); });
    if (ui.actFiltro === 'pending') list = list.filter((a) => !a.hecha).sort((x, y) => x.fecha.localeCompare(y.fecha));
    else if (ui.actFiltro === 'done') list = list.filter((a) => a.hecha).sort((x, y) => y.fecha.localeCompare(x.fecha));
    else list = list.sort((x, y) => y.fecha.localeCompare(x.fecha));
    const labels = { pending: T.fPending, done: T.fDone, all: T.fAll };
    const chips = ['pending', 'done', 'all'].map((f) => '<button type="button" class="chip" data-action="act-filtro" data-v="' + f + '" aria-pressed="' + (ui.actFiltro === f) + '">' + labels[f] + '</button>').join('');
    return head(T.tabs.actividades, T.actsSub, btnNew('new-act', T.newAct)) +
      '<div class="filters" role="group" aria-label="' + T.filterActs + '">' + chips + '</div>' +
      '<section class="card" style="padding:4px 24px"><div class="acts strike">' +
      (list.length ? list.map((a) => actRow(a, { check: true, edit: true, detail: true })).join('') : empty(T.nothing, ui.actFiltro === 'pending' ? T.nothingPending : T.nothingAll)) +
      '</div></section>';
  }

  const VIEWS = { inicio: vInicio, contactos: vContactos, ficha: vFicha, empresas: vEmpresas, negocios: vNegocios, actividades: vActividades };
  function render() { renderNav(); $('#view').innerHTML = VIEWS[ui.tab](); bindBoard(); bindQuick(); }
  function go(tab) { ui.tab = tab; render(); $('#view').focus({ preventScroll: true }); window.scrollTo(0, 0); }

  /* ---------- Drawer / forms ---------- */
  const opt = (list, val, emptyLabel) => (emptyLabel ? '<option value="">' + esc(emptyLabel) + '</option>' : '') + list.map((o) => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(val) ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('');
  const dict = (keys, d) => keys.map((k) => ({ v: k, l: d[k] }));
  const inp = (label, name, val, type, extra) => '<label class="f">' + label + '<input name="' + name + '" type="' + (type || 'text') + '" value="' + esc(val) + '"' + (extra || '') + '></label>';
  const sel = (label, name, options) => '<label class="f">' + label + '<select name="' + name + '">' + options + '</select></label>';
  const err = (k) => '<div class="err" data-err="' + k + '"></div>';
  const empOpts = (v) => opt(db.empresas.map((e) => ({ v: e.id, l: e.nombre })), v, T.noCompany);
  const conOpts = (v) => opt(db.contactos.map((c) => ({ v: c.id, l: c.nombre })), v, T.noContact);

  const FORMS = {
    contacto: {
      col: 'contactos', tNew: 'newContact', tEdit: 'editContact', saved: 'savedContact', required: ['nombre'],
      body: (r) => inp(T.fFullName, 'nombre', r.nombre, 'text', ' required autocomplete="off"') + err('nombre') +
        inp(T.fJob, 'cargo', txt(r, 'cargo')) +
        '<div class="form-row">' + inp(T.cPhone, 'telefono', r.telefono, 'tel', ' placeholder="+54 9 11 …"') + inp(T.cEmail, 'email', r.email, 'email') + '</div>' +
        sel(T.cCompany, 'empresaId', empOpts(r.empresaId)) + sel(T.cState, 'estado', opt(dict(ESTADOS, T.estado), r.estado || 'prospect'))
    },
    empresa: {
      col: 'empresas', tNew: 'newCompany', tEdit: 'editCompany', saved: 'savedCompany', required: ['nombre'],
      body: (r) => inp(T.fName, 'nombre', r.nombre, 'text', ' required autocomplete="off"') + err('nombre') +
        '<div class="form-row">' + inp(T.fIndustry, 'industria', txt(r, 'industria')) + inp(T.fCity, 'ciudad', txt(r, 'ciudad')) + '</div>' +
        '<div class="form-row">' + inp(T.cPhone, 'telefono', r.telefono, 'tel') + inp(T.fWeb, 'web', r.web) + '</div>'
    },
    negocio: {
      col: 'negocios', tNew: 'newDeal', tEdit: 'editDeal', saved: 'savedDeal', required: ['titulo'],
      body: (r) => inp(T.fTitle, 'titulo', txt(r, 'titulo'), 'text', ' required autocomplete="off"') + err('titulo') +
        '<div class="form-row">' + inp(T.fAmount, 'monto', r.monto, 'number', ' min="0" step="100"') + sel(T.fStage, 'etapa', opt(dict(ETAPAS, T.etapa), r.etapa || 'prospect')) + '</div>' +
        sel(T.cCompany, 'empresaId', empOpts(r.empresaId)) + sel(T.fContact, 'contactoId', conOpts(r.contactoId))
    },
    actividad: {
      col: 'actividades', tNew: 'newAct', tEdit: 'editAct', saved: 'savedAct', required: ['titulo'],
      body: (r) => '<div class="form-row">' + sel(T.type, 'tipo', opt(dict(TIPOS, T.tipo), r.tipo || 'call')) + inp(T.fDate, 'fecha', toLocalInput(r.fecha), 'datetime-local') + '</div>' +
        inp(T.fSubject, 'titulo', r.id ? actTitle(r) : '', 'text', ' required autocomplete="off"') + err('titulo') +
        sel(T.fContact, 'contactoId', conOpts(r.contactoId)) +
        '<label class="f">' + T.fDetail + '<textarea name="detalle" rows="3">' + esc(txt(r, 'detalle')) + '</textarea></label>' +
        '<label style="display:flex;gap:10px;align-items:center;font-weight:600;font-size:13px"><input type="checkbox" name="hecha" style="width:20px;height:20px;accent-color:#002540"' + (r.hecha ? ' checked' : '') + '>' + T.markDone + '</label>'
    }
  };

  let lastFocus = null;
  function openForm(kind, id, preset) {
    const F = FORMS[kind];
    const rec = id ? db[F.col].find((x) => x.id === id) : Object.assign({}, preset || {});
    lastFocus = document.activeElement;
    $('#layer').innerHTML = '<div class="overlay" data-action="overlay"><form class="drawer" role="dialog" aria-modal="true" aria-labelledby="dt" novalidate data-kind="' + kind + '" data-id="' + (id || '') + '">' +
      '<div class="drawer-head"><h2 id="dt">' + (id ? T[F.tEdit] : T[F.tNew]) + '</h2><button type="button" class="icon-btn" aria-label="' + T.close + '" data-action="close">' + ICON.close + '</button></div>' +
      '<div class="drawer-body">' + F.body(rec) + '</div>' +
      '<div class="drawer-foot">' + (id ? '<button type="button" class="btn danger" data-action="del-' + kind + '" data-id="' + id + '">' + T.del + '</button>' : '<button type="button" class="btn" data-action="close">' + T.cancel + '</button>') +
      '<button type="submit" class="btn primary">' + T.save + '</button></div></form></div>';
    const f = $('#layer form');
    f.addEventListener('submit', (ev) => { ev.preventDefault(); saveForm(f); });
    setTimeout(() => { const first = f.querySelector('input:not([type=checkbox]),select'); if (first) first.focus(); }, 30);
  }
  function closeForm() { const had = $('#layer').innerHTML; $('#layer').innerHTML = ''; if (had && lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); }

  function saveForm(f) {
    const kind = f.dataset.kind, id = f.dataset.id, F = FORMS[kind];
    const data = {};
    f.querySelectorAll('input,select,textarea').forEach((el) => { if (el.name) data[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim(); });
    let ok = true;
    F.required.forEach((k) => { const box = f.querySelector('[data-err="' + k + '"]'); if (!data[k]) { ok = false; if (box) box.textContent = T.required; } else if (box) box.textContent = ''; });
    if (!ok) { f.querySelector('[name="' + F.required[0] + '"]').focus(); return; }
    if (kind === 'negocio') { data.monto = Number(data.monto) || 0; if (!data.empresaId && data.contactoId) data.empresaId = (contacto(data.contactoId) || {}).empresaId || ''; }
    if (kind === 'actividad') data.fecha = data.fecha ? new Date(data.fecha).toISOString() : now().toISOString();
    if (id) {
      const rec = db[F.col].find((x) => x.id === id);
      // Solo se fija el texto de los campos que el usuario cambió
      if (rec._i) Object.keys(rec._i).forEach((k) => { if (data[k] === T.seed[rec._i[k]]) delete data[k]; else delete rec._i[k]; });
      if (kind === 'actividad' && rec.resultado) { if (data.titulo === actTitle(rec)) delete data.titulo; else delete rec.resultado; }
      Object.assign(rec, data);
    } else db[F.col].unshift(Object.assign({ id: uid() }, data));
    persist(); closeForm(); render(); toast(T[F.saved]);
  }

  function remove(kind, id) {
    const F = FORMS[kind]; const rec = db[F.col].find((x) => x.id === id); if (!rec) return;
    const name = rec.nombre || (kind === 'actividad' ? actTitle(rec) : txt(rec, 'titulo'));
    if (!confirm(T.confirmDel(name))) return;
    db[F.col] = db[F.col].filter((x) => x.id !== id);
    if (kind === 'contacto') { db.actividades = db.actividades.filter((a) => a.contactoId !== id); db.negocios.forEach((n) => { if (n.contactoId === id) n.contactoId = ''; }); if (ui.contactoId === id) ui.tab = 'contactos'; }
    if (kind === 'empresa') { db.contactos.forEach((c) => { if (c.empresaId === id) c.empresaId = ''; }); db.negocios.forEach((n) => { if (n.empresaId === id) n.empresaId = ''; }); }
    persist(); closeForm(); render(); toast(T.deleted);
  }

  /* ---------- Quick interaction (ficha) ---------- */
  function bindQuick() {
    const f = $('#quick'); if (!f) return;
    f.addEventListener('submit', (ev) => {
      ev.preventDefault();
      db.actividades.unshift({ id: uid(), tipo: f.tipo.value, resultado: f.resultado.value, contactoId: ui.contactoId, fecha: now().toISOString(), hecha: true, detalle: f.detalle.value.trim() });
      persist(); render(); toast(T.savedInteraction);
    });
  }

  /* ---------- Kanban drag & drop ---------- */
  function bindBoard() {
    document.querySelectorAll('.deal').forEach((d) => {
      d.addEventListener('dragstart', (e) => { d.classList.add('dragging'); e.dataTransfer.setData('text/plain', d.dataset.id); e.dataTransfer.effectAllowed = 'move'; });
      d.addEventListener('dragend', () => d.classList.remove('dragging'));
    });
    document.querySelectorAll('.col').forEach((col) => {
      col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', (e) => {
        e.preventDefault(); col.classList.remove('over');
        const n = db.negocios.find((x) => x.id === e.dataTransfer.getData('text/plain'));
        if (n && n.etapa !== col.dataset.etapa) { n.etapa = col.dataset.etapa; persist(); render(); toast(T.movedTo(T.etapa[n.etapa])); }
      });
    });
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action]'); if (!t) return;
    const a = t.dataset.action, id = t.dataset.id;
    if (a === 'overlay') { if (e.target === t) closeForm(); return; }
    if (a === 'tab') return go(t.dataset.tab);
    if (a === 'ficha') { ui.contactoId = id; closeForm(); return go('ficha'); }
    if (a === 'estado') { ui.estado = t.dataset.v; return render(); }
    if (a === 'act-filtro') { ui.actFiltro = t.dataset.v; return render(); }
    if (a === 'close') return closeForm();
    if (a === 'new-contacto') return openForm('contacto');
    if (a === 'edit-contacto') return openForm('contacto', id);
    if (a === 'del-contacto') return remove('contacto', id);
    if (a === 'new-empresa') return openForm('empresa');
    if (a === 'edit-empresa') return openForm('empresa', id);
    if (a === 'del-empresa') return remove('empresa', id);
    if (a === 'empresa-contactos') { const em = empresa(id); ui.query = em ? em.nombre : ''; $('#search').value = ui.query; ui.estado = 'all'; return go('contactos'); }
    if (a === 'new-negocio') { const c = contacto(t.dataset.contacto); return openForm('negocio', null, c ? { contactoId: c.id, empresaId: c.empresaId } : null); }
    if (a === 'edit-negocio') return openForm('negocio', id);
    if (a === 'del-negocio') return remove('negocio', id);
    if (a === 'new-act') return openForm('actividad', null, { contactoId: t.dataset.contacto || '', fecha: now().toISOString() });
    if (a === 'edit-act') return openForm('actividad', id);
    if (a === 'del-actividad') return remove('actividad', id);
    if (a === 'reset') {
      if (!confirm(T.confirmReset)) return;
      store.clear(); db = seed(); ui.query = ''; $('#search').value = ''; ui.estado = 'all'; persist(); go('inicio'); toast(T.resetDone);
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'lang') return setLang(e.target.value);
    if (e.target.matches('[data-action="toggle-act"]')) {
      const act = db.actividades.find((x) => x.id === e.target.dataset.id);
      if (act) { act.hecha = e.target.checked; persist(); render(); toast(act.hecha ? T.actDone : T.actReopen); }
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#layer').innerHTML) closeForm(); });
  let qTimer;
  $('#search').addEventListener('input', (e) => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      ui.query = e.target.value;
      if (ui.tab === 'inicio' || ui.tab === 'ficha') ui.tab = 'contactos';
      render();
    }, 120);
  });

  persist();
  applyStatic();
  render();
})();
</script>
</body>
</html>
